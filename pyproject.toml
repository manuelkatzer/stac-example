[project]
name = "stac-ingest"
version = "0.1.0"
description = "Scan a folder for LAS/LAZ point clouds and panoramic images and load valid ones into pgstac"
requires-python = ">=3.11,<3.13"
dependencies = [
    "laspy[lazrs]>=2.5",
    "pyproj>=3.6",
    "Pillow>=10.0",
    "pypgstac[psycopg]==0.9.8",
]

[tool.uv]
package = false
