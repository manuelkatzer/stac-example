# Minimal config for serving point-cloud / static assets with:
#   - HTTP range request support (206 Partial Content) - on by default for
#     static files, called out explicitly here so it's not accidentally
#     broken later (e.g. by proxying through something that buffers).
#   - CORS headers, including the ones browsers hide unless exposed
#     explicitly (Content-Range, Accept-Ranges) - required for COPC
#     clients running in-browser (e.g. stac-map, potree) to stream
#     partial files cross-origin.
#   - Directory listing, as a rough equivalent of the old
#     SHOW_LISTING option on the static-file-server image.
server {
    listen 80;
    server_name _;

    # Bare-metal: point directly at the real data folder (no /web mount
    # like in the Docker version - that only existed because of the
    # volume mapping in docker-compose.yml).
    root /home/manulinux/stac-example/data;

    # Directory listing (equivalent of SHOW_LISTING: "true")
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # gzip is off by default in nginx - left explicitly off here as a
    # reminder not to enable it for this location. LAZ files are already
    # compressed, and gzip-on-the-fly does not play well with range
    # requests on binary files.
    gzip off;

    # --- CORS ---
    # Set here at server level (not inside a single location block) so
    # EVERY location below inherits it. add_header does NOT carry over
    # between sibling location blocks - only from an enclosing
    # server{}/http{} down into locations that don't define their own
    # add_header. That's why the file location below wasn't getting
    # these headers before: it's a sibling of location /, not a child.
    #
    # '*' is fine for a read-only, unauthenticated file server used
    # only for public/internal STAC assets. Lock this down to a
    # specific origin if these files are ever not meant to be public.
    add_header Access-Control-Allow-Origin '*' always;
    add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Range' always;

    # Without this, browsers receive the 206 response but JS code
    # (fetch/XHR) cannot read these headers cross-origin, which
    # breaks range-based streaming clients silently.
    add_header Access-Control-Expose-Headers 'Content-Range, Accept-Ranges, Content-Length' always;

    location / {
        # Preflight requests some clients send before a ranged GET
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Range' always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # LAZ/COPC files have no default MIME type in nginx. Serving them as
    # octet-stream is harmless for COPC clients (they don't rely on the
    # declared type), but set explicitly for clarity / future tooling.
    location ~* \.(laz|copc\.laz)$ {
        default_type application/octet-stream;
    }
}
